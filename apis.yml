aid: tracelink
name: TraceLink
description: 'TraceLink, Inc. is a Massachusetts-based supply chain digitalization company for the life
  sciences and healthcare industries, best known for pharmaceutical serialization and track-and-trace
  compliance (US DSCSA, EU FMD, and roughly two dozen national regimes) delivered on its multienterprise
  OPUS network platform. TraceLink exposes several distinct integration surfaces rather than one REST
  API: a set of publicly served SOAP/WSDL services on api.tracelink.com (Serialized Operations Manager,
  Product Track, Serial Number Exchange), a synchronous REST API for Smart Event Manager, an event-driven
  OPUS Platform API where every call is a POST to a single /api/events endpoint carrying a header/payload
  envelope keyed by a fully qualified eventName, a GraphQL endpoint at /api/graphql used by the Agile
  Process Teams app, and asynchronous B2B message exchange over AS2, SFTP, and HTTP POST using EPCIS,
  EDI ANSI X12, SAP IDoc, and TraceLink XML canonical documents. Its published API guides, canonical JSON
  Schemas, and code samples are the machine-readable surface catalogued here.'
