apis:
- aid: tracelink:serialized-operations-manager
  name: TraceLink Serialized Operations Manager (SOAP)
  description: 'SOAP web service for serialized operations: commissioning, aggregation, decommissioning,
    shipment and receipt orders, serial number verification, lot status, market release, sampling, and
    destruction. The WSDL is served publicly from the production API host and declares 40 operations.'
  humanURL: https://opus.tracelink.com/documentation/2026.1/en-US/api/som/soap/pdfs/som_soap_api_guide_2026.1.pdf
  baseURL: https://api.tracelink.com/soap/som
  tags:
  - Serialization
  - SOAP
  - Track and Trace
  properties:
  - type: WSDL
    url: wsdl/tracelink-serialized-operations-manager.wsdl
  - type: APIReference
    url: https://opus.tracelink.com/documentation/2026.1/en-US/api/som/soap/pdfs/som_soap_api_guide_2026.1.pdf
- aid: tracelink:product-track
  name: TraceLink Product Track (SOAP)
  description: SOAP web service supporting Product Track pick-and-ship operations for US DSCSA serialized
    product movement. The WSDL is served publicly from the production API host and declares PickShip and
    PickShipBasic.
  humanURL: https://www.tracelink.com/products/product-orchestration/country-compliance/us-compliance
  baseURL: https://api.tracelink.com/soap/producttrack
  tags:
  - DSCSA
  - SOAP
  - Track and Trace
  properties:
  - type: WSDL
    url: wsdl/tracelink-product-track.wsdl
- aid: tracelink:serial-number-exchange
  name: TraceLink Serial Number Exchange (SOAP)
  description: SOAP web service for requesting serial numbers from TraceLink Serial Number Exchange, used
    by packaging lines and contract manufacturers to obtain serial number ranges. The WSDL is served publicly
    from the production API host.
  humanURL: https://www.tracelink.com/products/product-orchestration/serialization/serial-number-exchange
  baseURL: https://api.tracelink.com/soap/snx/snrequest
  tags:
  - Serialization
  - SOAP
  properties:
  - type: WSDL
    url: wsdl/tracelink-serial-number-exchange.wsdl
- aid: tracelink:smart-event-manager
  name: TraceLink Smart Event Manager REST API
  description: Synchronous JSON/REST API that acts as an event ledger for serial number observations across
    pharmacy, warehouse, and supply chain activities. Supports Set Event, Get Event, and Get Result messages
    with HTTP Basic authentication.
  humanURL: https://opus.tracelink.com/documentation/2026.1/en-US/api/smart-event-manager/pdfs/smart_event_manager_api_guide_2026.1.pdf
  baseURL: https://api.tracelink.com
  tags:
  - REST
  - Serialization
  - Verification
  properties:
  - type: APIReference
    url: https://opus.tracelink.com/documentation/2026.1/en-US/api/smart-event-manager/pdfs/smart_event_manager_api_guide_2026.1.pdf
- aid: tracelink:opus-events
  name: TraceLink OPUS Platform Event API
  description: The OPUS Platform exposes one /api/events endpoint per environment. Every operation is
    a POST to that endpoint carrying a JSON envelope of header (headerVersion, eventName, ownerId, processNetworkId,
    appName, dataspace) and payload. The fully qualified eventName selects the operation, e.g. agile-process-teams:add-direct-supplier-incident:v3.
  humanURL: https://github.com/tracelink/code-samples
  baseURL: https://opus.tracelink.com/api/events
  tags:
  - Event-Driven
  - REST
  - Workflows
  tags_raw:
  - Event Driven
  - REST
  - Workflow
  properties:
  - type: Documentation
    url: https://github.com/tracelink/code-samples/blob/main/python/FormatRequests.MD
  - type: Examples
    url: https://github.com/tracelink/code-samples/tree/main/payload_samples
- aid: tracelink:opus-graphql
  name: TraceLink OPUS GraphQL API
  description: GraphQL endpoint used by the Agile Process Teams app, exposing genericActionCall and genericGetObject
    fields that dispatch on an action name and a JSON payload. Introspection is authentication-gated;
    the schema is not published.
  humanURL: https://github.com/tracelink/code-samples/tree/main/GraphQL
  baseURL: https://opus.tracelink.com/api/graphql
  tags:
  - GraphQL
  - Workflows
  tags_raw:
  - GraphQL
  - Workflow
  properties:
  - type: Examples
    url: https://github.com/tracelink/code-samples/tree/main/GraphQL
