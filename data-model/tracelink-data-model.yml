description: >-
  TraceLink's object model has three distinct layers, and they are addressed by three
  different surfaces. The SERIALIZATION layer (serial numbers, serialized entities, lots,
  orders, receipts) is reached over SOAP. The MULTIENTERPRISE COMMERCE layer (purchase
  orders, invoices, ship notices, inventory, forecasts) is expressed as canonical JSON
  objects moved as B2B messages. The WORK MANAGEMENT layer (incidents, change requests,
  tasks) is reached over the OPUS events and GraphQL surfaces. Everything is scoped by
  the network tenancy triple of owner company, process network, and dataspace.
tenancy:
  entities:
  - name: Owner Company
    id_field: ownerId
    description: The company that owns the process and the data.
  - name: Process Network
    id_field: processNetworkId
    description: A network within the Owner company containing the process; partners are members.
  - name: Dataspace
    id_field: dataspace
    description: Logical partition inside an environment (default value "default").
  - name: Network Node
    description: >-
      A physical location, logical location, sub-location, organization, legal entity or
      system — a plant, warehouse, or logical sub-division of a warehouse.
  relationships:
  - from: Process Network
    to: Owner Company
    type: belongs_to
    via: ownerId
  - from: Network Node
    to: Owner Company
    type: belongs_to
  - from: Partner Company
    to: Process Network
    type: has_many
    via: membership

