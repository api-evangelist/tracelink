  api_host: https://api.tracelink.com
  app_host: https://opus.tracelink.com
  b2b_host: 'https://prodb2b.tracelink.com:5443'
  live: true
- name: Validation
  api_host: https://itestapi.tracelink.com
  app_host: https://valvir-opus.tracelink.com
  live: false
  description: >-
