summary: >-
  TraceLink separates test from live by ENVIRONMENT, not by key prefix or a mode flag.
  Every customer gets a Validation tenant alongside Production (a computer-system
  validation requirement in life sciences), and TraceLink additionally runs OPUS Link
  Lab as a hands-on sandbox for customers and partners. There are no published magic
  test values — no test cards, test identifiers, or hosted test tokens — because the
  objects under test are the customer's own serialized products and trade partners.
